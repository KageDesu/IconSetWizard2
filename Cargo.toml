[package]
name = "iconset-wizard"
version = "1.0.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "links", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
